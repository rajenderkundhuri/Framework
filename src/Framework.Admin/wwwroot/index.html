<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Framework Admin</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Framework.Admin.styles.css" rel="stylesheet" />
    <style>
        html, body {
            font-family: 'Roboto', sans-serif;
        }
        .loading-progress {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
        }
        .loading-progress circle {
            fill: none;
            stroke: #1976d2;
            stroke-width: 6;
            transform-origin: 50% 50%;
        }
        .loading-progress circle:last-child {
            stroke-dasharray: calc(3.141 * 80%);
            animation: loading-progress 1.5s linear infinite;
        }
        @keyframes loading-progress {
            0% { stroke-dashoffset: 0; }
            50% { stroke-dashoffset: calc(3.141 * 80% * -0.5); }
            100% { stroke-dashoffset: calc(3.141 * 80% * -1); }
        }
        .loading-progress-text {
            position: fixed;
            top: calc(50% + 50px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
        .loading-progress-text:after {
            content: 'Loading...';
        }
        #blazor-error-ui {
            background: lightyellow;
            bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
            display: none;
            left: 0;
            padding: 0.6rem 1.25rem 0.7rem 1.25rem;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }
        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">X</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
